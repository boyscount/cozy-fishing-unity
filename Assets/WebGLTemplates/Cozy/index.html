<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1d3a2c">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1d3a2c; overflow: hidden; touch-action: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #1d3a2c; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      color: #f4efe1; font-family: system-ui, "Leelawadee UI", "Noto Sans Thai", sans-serif; background: radial-gradient(circle at 50% 40%, #2f5a43, #142a1f); }
    #loading h1 { margin: 0; font-size: clamp(26px, 6vw, 44px); font-weight: 700; letter-spacing: .5px; }
    #loading p { margin: 0; opacity: .8; font-size: 15px; }
    #bar { width: min(320px, 70vw); height: 10px; border-radius: 6px; background: rgba(255,255,255,.15); overflow: hidden; }
    #fill { width: 0; height: 100%; background: linear-gradient(90deg, #f2c94c, #7ed39b); transition: width .2s; }
    #error { display: none; max-width: 80vw; text-align: center; color: #ffb4a8; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <h1>ตกปลาสบายใจ</h1>
    <div id="bar"><div id="fill"></div></div>
    <p id="msg">กำลังโหลดทุ่งนา… (ครั้งแรกประมาณ 50MB)</p>
    <p id="error"></p>
  </div>
  <script>
    var canvas = document.getElementById("unity-canvas");
    // จอมือถือความละเอียดสูง: จำกัด devicePixelRatio ไม่ให้หนักเกินไป
    var config = {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, /Mobi|Android|iPhone|iPad/.test(navigator.userAgent) ? 1.5 : 2),
      showBanner: function (msg, type) { if (type === "error") { var e = document.getElementById("error"); e.textContent = msg; e.style.display = "block"; } },
    };
    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, config, function (p) {
        document.getElementById("fill").style.width = Math.round(p * 100) + "%";
      }).then(function () {
        document.getElementById("loading").style.display = "none";
      }).catch(function (err) {
        var e = document.getElementById("error"); e.textContent = "เปิดเกมไม่ได้: " + err; e.style.display = "block";
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
