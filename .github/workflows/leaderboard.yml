# ภาพรวมกระดานปลาใหญ่ประจำสัปดาห์ → gh-pages/leaderboard.json (หน้าแรกเว็บอ่านไฟล์นี้) · ทุกชั่วโมง หรือกดรันเองได้
name: Leaderboard snapshot
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: leaderboard-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (script + fish names)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Tools/leaderboard_snapshot.py
            Assets/Game/Resources/Data/species.json
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - name: Fetch scores
        env:
          UGS_KEY_ID: ${{ secrets.UGS_KEY_ID }}
          UGS_SECRET_KEY: ${{ secrets.UGS_SECRET_KEY }}
          OUT: site/leaderboard.json
        run: python3 Tools/leaderboard_snapshot.py
      - name: Publish to gh-pages
        working-directory: site
        run: |
          git config user.name "leaderboard-bot"
          git config user.email "leaderboard-bot@users.noreply.github.com"
          git add leaderboard.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update leaderboard snapshot"
          git push origin HEAD:gh-pages
